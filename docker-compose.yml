services:
  app:
    build:
      context: ./docker
      dockerfile: php/Dockerfile
    container_name: official-shop-app
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - official-shop-network

  db:
    image: postgres:17
    container_name: official-shop-db
    environment:
      POSTGRES_DB: official_shop
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: password
      # ./postgres 直下は .gitkeep があり initdb できないためサブディレクトリを使う
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d official_shop"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - official-shop-network

  adminer:
    image: adminer:5.3.0
    container_name: official-shop-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - official-shop-network

networks:
  official-shop-network:
    driver: bridge
