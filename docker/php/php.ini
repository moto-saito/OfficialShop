[PHP]
post_max_size = 100M
upload_max_filesize = 100M
memory_limit = 256M
max_execution_time = 300
display_errors = On
error_reporting = E_ALL
date.timezone = Asia/Tokyo
mbstring.language = Japanese
mbstring.internal_encoding = UTF-8

; --- CVE-2026-109618 / CVE-2026-109619 (PHP2Shell) 暫定緩和策 ---
; PHPコアのsession.upload_progress機能にUse-After-Freeの脆弱性(CVSS 9.2)があり、
; 未認証でのリモートコード実行につながる。本アプリはアップロード進捗バー機能を
; 使用していないため、PHP開発チーム推奨の緩和策として当該機能を無効化する。
; 注: これはCVE-2026-109619の確認済み攻撃経路を塞ぐ暫定策であり、完全な修正では
; ない。PHP 8.2.35以降へのアップグレードが公開され次第、必ず適用すること。
session.upload_progress.enabled = 0
