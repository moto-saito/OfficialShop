# Render 無料プランでの「デモ」公開用（本番はさくらのクラウド。DEPLOY.md 参照）
# SQLite を起動ごとに作り直すため、データはスリープ/再デプロイでリセットされる。
services:
  - type: web
    name: official-shop-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "公式ショップ（デモ）"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # `echo "base64:$(openssl rand -base64 32)"` の出力を貼り付ける
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: ja
      - key: APP_FALLBACK_LOCALE
        value: ja
      - key: DB_CONNECTION
        value: sqlite
      # Render のロードバランサ配下で HTTPS を検出するため
      - key: TRUSTED_PROXIES
        value: "*"
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: log
